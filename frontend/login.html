<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - School Lunch Menu Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Open Sans', sans-serif;
  background: #f0f2f5;
  color: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.login-card {
  background: #fff;
  border-radius: 12px;
  padding: 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 380px;
  text-align: center;
}

.login-card h1 {
  color: #1a5276;
  font-size: 1.4rem;
  margin-bottom: 8px;
}

.login-card p {
  color: #888;
  font-size: 0.9rem;
  margin-bottom: 24px;
}

.login-card input[type="password"] {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 1rem;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}

.login-card input[type="password"]:focus {
  outline: none;
  border-color: #2980b9;
}

.login-card button {
  width: 100%;
  padding: 12px;
  background: #27ae60;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.login-card button:hover {
  background: #1e8449;
}

.login-card button:disabled {
  background: #95a5a6;
  cursor: not-allowed;
}

.error-msg {
  color: #e74c3c;
  font-size: 0.85rem;
  margin-bottom: 12px;
  display: none;
}

.warning-banner {
  background: #fef3cd;
  color: #856404;
  border: 1px solid #ffc107;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 0.82rem;
  margin-bottom: 16px;
  text-align: left;
  display: none;
}
</style>
</head>
<body>

<div class="login-card">
  <h1>School Lunch Menu Calendar</h1>
  <p>Enter password to continue</p>
  <div class="warning-banner" id="warning-banner">
    The password is still set to the default example value. Please change it after logging in.
  </div>
  <div class="error-msg" id="error-msg">Invalid password. Please try again.</div>
  <form id="login-form">
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <button type="submit" id="login-btn">Log In</button>
  </form>
</div>

<script>
const form = document.getElementById('login-form');
const input = document.getElementById('password-input');
const errorMsg = document.getElementById('error-msg');
const loginBtn = document.getElementById('login-btn');

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  errorMsg.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: input.value })
    });

    if (res.ok) {
      window.location.href = '/';
    } else {
      errorMsg.style.display = 'block';
      input.value = '';
      input.focus();
    }
  } catch (err) {
    errorMsg.textContent = 'Connection error. Please try again.';
    errorMsg.style.display = 'block';
  }

  loginBtn.disabled = false;
  loginBtn.textContent = 'Log In';
});

(async function checkWarning() {
  try {
    const res = await fetch('/api/holidays');
    if (res.status === 200) {
      window.location.href = '/';
    }
  } catch(e) {}
})();
</script>

</body>
</html>
